app = 'pet-matcher'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

  # /embed corre la inferencia en el event loop, no en un threadpool — así
  # que esta única máquina procesa una foto a la vez de todos modos. El
  # límite existe para que un pico (o abuso) de pedidos se rechace en el
  # proxy en vez de acumularse en la memoria de una máquina de 1GB.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 5
    hard_limit = 10

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
